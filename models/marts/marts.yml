version: 2

models:
  - name: dim_customers
    description: customers dimension model
    columns: 
      - name: customer_id
        description: The primary key for customers.
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
  - name: fct_orders
    description: orders fact model
    columns:
      - name: order_id
        description: the primary key for orders
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_jaffle_shop__orders')
              field: order_id
  - name: orders_by_customer_9
    description: how many orders has each customer placed?
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null