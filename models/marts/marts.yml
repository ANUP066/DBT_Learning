version: 2

models:
  - name: dim_customers
    description: customers dimension model
    columns: 
      - name: customer_id
        description: The primary key for customers.
        tests:
          - unique
          - not_null
          - dbt_utils.cardinality_equality:
              field: customer_id
              to: ref('stg_customers')
          - relationships:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
  - name: fct_orders
    description: orders fact model
    tests:
      - dbt_utils.expression_is_true:
          expression: "amount > 5"
    columns:
      - name: order_id
        description: the primary key for orders
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_jaffle_shop__orders')
              field: order_id
      - name: amount
        description: dollar spent per order
        tests:
          - assert_column_is_greater_than_five
          - assert_dollars_spent_are_greater_than_one
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 5
              row_condition: "order_id is not null"
              strictly: True
          - dbt_expectations.expect_column_mean_to_be_between: 
          # this will perform what our singular and generic tests do!
              min_value: 1
              group_by: [customer_id] 
              row_condition: "order_id is not null" # (Optional)
              strictly: false
      - name: customer_id
        tests:
          - relationships:
              field: customer_id
              to: ref('stg_jaffle_shop__customers')
          - unique
              #config:
                #store_failures: true
                #schema: test_failures
                #limit: 10
                #where: "order_date > '2018-03-01'"
                #severity: warn
                #error_if: ">100"
                #warn_if: ">30"
  - name: orders_by_customer_9
    description: how many orders has each customer placed?
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null